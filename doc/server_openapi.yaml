openapi: 3.0.3
info:
  title: GitBoard Server API
  version: 0.4.2
  description: Local REST API for the GitBoard web client.
servers:
  - url: http://127.0.0.1:8080
paths:
  /api/config:
    get:
      summary: Get server configuration
      operationId: getConfig
      responses:
        "200":
          description: Current repository mappings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigResponse"
        default:
          $ref: "#/components/responses/Error"
  /api/repos:
    post:
      summary: Add a repository mapping
      operationId: addRepository
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddRepositoryRequest"
      responses:
        "201":
          description: Repository added.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /api/repos/select-path:
    post:
      summary: Open a native folder picker and validate the selected repository path
      operationId: selectRepositoryPath
      responses:
        "200":
          description: A Git work tree path was selected, or the user cancelled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SelectRepositoryPathResponse"
        "400":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /api/repos/{id}:
    delete:
      summary: Remove a repository mapping
      operationId: removeRepository
      parameters:
        - $ref: "#/components/parameters/RepositoryId"
      responses:
        "200":
          description: Repository removed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /api/ai/config:
    get:
      summary: Get AI configuration metadata
      operationId: getAiConfig
      responses:
        "200":
          description: Current AI configuration without secrets.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiConfigResponse"
        default:
          $ref: "#/components/responses/Error"
    put:
      summary: Save AI configuration
      operationId: saveAiConfig
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiConfigUpdateRequest"
      responses:
        "200":
          description: Saved AI configuration without secrets.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiConfigResponse"
        "400":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /api/ai/test:
    post:
      summary: Validate saved AI configuration
      operationId: testAiConfig
      responses:
        "200":
          description: AI configuration is complete for phase 1.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiTestResponse"
        "400":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /api/agent/chat:
    post:
      summary: Send a chat message to Agent Pip with read-only task context
      operationId: agentChat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentChatRequest"
      responses:
        "200":
          description: Assistant response grounded in read-only Barnaby task data.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentChatResponse"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /api/agent/actions/apply:
    post:
      summary: Apply selected Agent Pip proposed task actions
      operationId: applyAgentActions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentActionApplyRequest"
      responses:
        "200":
          description: Selected actions were applied through serialized server operations.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentActionApplyResponse"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /api/agent/summarize:
    post:
      summary: Summarize older Agent Pip conversation history
      operationId: summarizeAgentHistory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentHistorySummaryRequest"
      responses:
        "200":
          description: Compact replacement summary for older turns.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentHistorySummaryResponse"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /batch:
    post:
      summary: Run a GitBoard batch command
      operationId: runBatch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchRequest"
      responses:
        "200":
          description: Batch completed successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchResponse"
        "400":
          description: Invalid request or GitBoard batch failure.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ErrorResponse"
                  - $ref: "#/components/schemas/BatchResponse"
        "404":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
components:
  parameters:
    RepositoryId:
      name: id
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-z0-9_]+$"
  responses:
    Error:
      description: Error response.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    OkResponse:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
          enum: [true]
    ErrorResponse:
      type: object
      required: [ok, error]
      properties:
        ok:
          type: boolean
          enum: [false]
        error:
          type: string
    ConfigResponse:
      type: object
      required: [ok, repositories]
      properties:
        ok:
          type: boolean
          enum: [true]
        repositories:
          type: object
          additionalProperties:
            type: string
    AddRepositoryRequest:
      type: object
      required: [id, path]
      additionalProperties: false
      properties:
        id:
          type: string
          pattern: "^[a-z0-9_]+$"
        path:
          type: string
    SelectRepositoryPathResponse:
      type: object
      required: [ok, cancelled]
      properties:
        ok:
          type: boolean
          enum: [true]
        cancelled:
          type: boolean
        path:
          type: string
          description: Canonical absolute path when cancelled is false.
    AiConfigResponse:
      type: object
      required:
        - ok
        - enabled
        - provider
        - baseUrl
        - model
        - apiKeyConfigured
      properties:
        ok:
          type: boolean
          enum: [true]
        enabled:
          type: boolean
        provider:
          type: string
          description: Provider label, either openai-compatible or anthropic-compatible.
        baseUrl:
          type: string
        model:
          type: string
        apiKeyRef:
          type: string
          description: Secret reference, such as macos-keychain:model@baseUrl or linux-secret-service:model@baseUrl.
        timeoutSeconds:
          type: integer
          minimum: 1
          maximum: 3600
        retryAttempts:
          type: integer
          minimum: 0
          maximum: 20
        maxOutputTokens:
          type: integer
          minimum: 0
        allowWrites:
          type: boolean
        systemPrompt:
          type: string
          description: Agent Pip system instructions. Task context is appended by the server.
        apiKeyConfigured:
          type: boolean
          description: Whether an API key is saved. The key value is never returned.
        secretStorage:
          type: string
          description: Secure storage backend, such as macos-keychain or linux-secret-service.
        secretStorageWarning:
          type: string
          nullable: true
    AiConfigUpdateRequest:
      type: object
      additionalProperties: false
      properties:
        enabled:
          type: boolean
        provider:
          type: string
          description: Provider label, either openai-compatible or anthropic-compatible.
        baseUrl:
          type: string
        model:
          type: string
        apiKeyRef:
          type: string
        apiKey:
          type: string
          writeOnly: true
        clearApiKey:
          type: boolean
        timeoutSeconds:
          type: integer
          minimum: 1
          maximum: 3600
        retryAttempts:
          type: integer
          minimum: 0
          maximum: 20
        maxOutputTokens:
          type: integer
          minimum: 0
        allowWrites:
          type: boolean
        systemPrompt:
          type: string
          maxLength: 20000
    AiTestResponse:
      type: object
      required: [ok, message]
      properties:
        ok:
          type: boolean
          enum: [true]
        message:
          type: string
    AgentChatRequest:
      type: object
      required: [repoId, message]
      additionalProperties: false
      properties:
        repoId:
          type: string
          pattern: "^[a-z0-9_]+$"
        conversationId:
          type: string
        history:
          type: array
          maxItems: 10
          items:
            $ref: "#/components/schemas/AgentMessage"
        historySummary:
          type: string
          maxLength: 12000
        message:
          type: string
        mode:
          type: string
          enum: [chat]
    AgentChatResponse:
      type: object
      required: [ok, conversationId, messages, drafts, proposedActions, ui]
      properties:
        ok:
          type: boolean
          enum: [true]
        conversationId:
          type: string
        messages:
          type: array
          items:
            $ref: "#/components/schemas/AgentMessage"
        drafts:
          type: array
          items:
            type: object
        proposedActions:
          type: array
          items:
            $ref: "#/components/schemas/AgentProposedAction"
        ui:
          type: object
    AgentActionApplyRequest:
      type: object
      required: [repoId, actions]
      additionalProperties: false
      properties:
        repoId:
          type: string
          pattern: "^[a-z0-9_]+$"
        actions:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/AgentProposedAction"
    AgentActionApplyResponse:
      type: object
      required: [ok, applied, tasks, dbstatus]
      properties:
        ok:
          type: boolean
          enum: [true]
        applied:
          type: integer
          minimum: 1
        tasks:
          type: array
          items:
            type: object
        dbstatus:
          type: object
    AgentProposedAction:
      type: object
      required: [id, type, selected]
      additionalProperties: true
      properties:
        id:
          type: string
        type:
          type: string
          enum: [update_task, move_task, comment_task, add_team_member]
        taskId:
          type: string
          pattern: "^TASK-[A-Za-z0-9+-]+$"
        title:
          type: string
        summary:
          type: string
        selected:
          type: boolean
        fields:
          type: object
          properties:
            story_points:
              type: integer
              enum: [1, 2, 3, 5, 8, 13, 21, 100]
        status:
          type: string
        message:
          type: string
        alias:
          type: string
        email:
          type: string
    AgentHistorySummaryRequest:
      type: object
      required: [repoId, messages]
      additionalProperties: false
      properties:
        repoId:
          type: string
          pattern: "^[a-z0-9_]+$"
        historySummary:
          type: string
          maxLength: 12000
        messages:
          type: array
          minItems: 1
          maxItems: 3
          items:
            $ref: "#/components/schemas/AgentMessage"
    AgentHistorySummaryResponse:
      type: object
      required: [ok, historySummary]
      properties:
        ok:
          type: boolean
          enum: [true]
        historySummary:
          type: string
    AgentMessage:
      type: object
      required: [role, content]
      properties:
        role:
          type: string
          enum: [assistant, user]
        content:
          type: string
    BatchRequest:
      type: object
      required: [repoId, batch]
      additionalProperties: false
      properties:
        repoId:
          type: string
          pattern: "^[a-z0-9_]+$"
        batch:
          type: array
          items:
            $ref: "#/components/schemas/BatchCommand"
    BatchCommand:
      type: object
      required: [cmd, args]
      additionalProperties: false
      properties:
        cmd:
          type: string
        args:
          type: array
          items:
            type: string
    BatchResponse:
      type: object
      required: [batch]
      properties:
        batch:
          type: array
          items:
            $ref: "#/components/schemas/BatchCommandResult"
    BatchCommandResult:
      type: object
      required: [cmd, ok, result, error]
      properties:
        cmd:
          type: string
        ok:
          type: boolean
        result:
          type: string
          description: Base64-encoded command output, or an empty string.
        error:
          type: string
          description: Base64-encoded error message, or an empty string.
